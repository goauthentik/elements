# .github/workflows/ci.yml

name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Use your desired Node.js version

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium # Installs chromium and its system dependencies

      - name: Run Vitest browser tests
        run: npm test:ci # or whatever script runs your vitest command
        # Ensure your test script doesn't override the headless: true config with a flag like --no-headless
